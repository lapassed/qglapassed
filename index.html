/* Layout: salle de contrôle — rail de navigation à gauche (barre en bas sur mobile), en-tête avec compte à rebours, vues opérationnelles en tableaux éditables.
   Palette issue de la charte La Passe D : noir profond, bleu acier, gris perle, blanc + bleu ciel #99DAFF en accent. */
:root{
  --bg:#0B0F14; --panel:#121923; --panel-2:#18202C; --line:#2B3340; --line-2:#222A36;
  --fg:#EEF1F4; --muted:#8E99A8; --faint:#5E6979;
  --accent:#99DAFF; --accent-ink:#0B0F14; --accent-soft:rgba(153,218,255,.12);
  --good:#62D39C; --good-soft:rgba(98,211,156,.14);
  --warn:#F1C35A; --warn-soft:rgba(241,195,90,.14);
  --bad:#F27A72; --bad-soft:rgba(242,122,114,.14);
  --shadow:0 18px 50px rgba(0,0,0,.45);
  --display:"Big Shoulders Display","Arial Narrow","Roboto Condensed",Impact,sans-serif;
  --body:"Inter","Helvetica Neue",Arial,system-ui,sans-serif;
  --r:10px;
  color-scheme:dark;
}
@media (prefers-color-scheme: light){
  :root:not([data-theme="dark"]){
    --bg:#F3F5F7; --panel:#FFFFFF; --panel-2:#EDF0F3; --line:#D9DDE2; --line-2:#E6E9ED;
    --fg:#0B0F14; --muted:#5A6472; --faint:#8A94A1;
    --accent:#1D6A94; --accent-ink:#FFFFFF; --accent-soft:rgba(29,106,148,.10);
    --good:#1E8A57; --good-soft:rgba(30,138,87,.12);
    --warn:#A87508; --warn-soft:rgba(168,117,8,.12);
    --bad:#C2392F; --bad-soft:rgba(194,57,47,.10);
    --shadow:0 18px 50px rgba(11,15,20,.14);
    color-scheme:light;
  }
}
:root[data-theme="light"]{
  --bg:#F3F5F7; --panel:#FFFFFF; --panel-2:#EDF0F3; --line:#D9DDE2; --line-2:#E6E9ED;
  --fg:#0B0F14; --muted:#5A6472; --faint:#8A94A1;
  --accent:#1D6A94; --accent-ink:#FFFFFF; --accent-soft:rgba(29,106,148,.10);
  --good:#1E8A57; --good-soft:rgba(30,138,87,.12);
  --warn:#A87508; --warn-soft:rgba(168,117,8,.12);
  --bad:#C2392F; --bad-soft:rgba(194,57,47,.10);
  --shadow:0 18px 50px rgba(11,15,20,.14);
  color-scheme:light;
}

.brand b{font-family:var(--display);font-weight:800;font-size:22px;letter-spacing:.02em;line-height:1;text-transform:uppercase}
.brand small{display:block;font-size:10px;letter-spacing:.24em;color:var(--muted);text-transform:uppercase;margin-top:3px}
.nav a{display:flex;align-items:center;gap:11px;padding:9px 10px;border-radius:8px;color:var(--muted);text-decoration:none;font-weight:500;position:relative}
.nav a svg{width:18px;height:18px;flex:none}
.nav a:hover{background:var(--panel-2);color:var(--fg)}
.nav a.on{background:var(--accent-soft);color:var(--fg)}
.nav a.on svg{color:var(--accent)}
.nav a .kbd{margin-left:auto;font-size:11px;color:var(--faint)}
.nav a .dot{margin-left:auto;min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--bad);color:#fff;font-size:11px;font-weight:700;display:grid;place-items:center}
.nav .foot{margin-top:auto;padding:12px 10px 0;border-top:1px solid var(--line);font-size:12px;color:var(--muted);display:flex;flex-direction:column;gap:8px}
.sync{display:flex;align-items:center;gap:8px}
.sync i{width:8px;height:8px;border-radius:50%;background:var(--faint)}
.sync.live i{background:var(--good);box-shadow:0 0 0 3px var(--good-soft)}
.sync.ro i{background:var(--warn)}
.online{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.ol-l{font-size:12px}
.stack{display:flex}
.stack .avi{margin-left:-6px;border:2px solid var(--panel)}
.stack .avi:first-child{margin-left:0}
.avi{width:24px;height:24px;border-radius:50%;background:var(--line);flex:none;object-fit:cover}

main{min-width:0;display:flex;flex-direction:column}

 const tDone=S.taches.filter(t=>t.fait).length, tAll=S.taches.length;

 const eq=S.equipes.length, eqPaid=S.equipes.filter(e=>e.paye).length;

}

/* ---------- Jour J ---------- */
function addMin(h,m){const[a,b]=h.split(':').map(Number);const t=a*60+b+m;return String(Math.floor(t/60)).padStart(2,'0')+':'+String(t%60).padStart(2,'0')}
function teamName(id){const e=S.equipes.find(x=>x.id===id);return e?e.nom:null}
const scored=m=>m.sa!=null&&m.sa!==''&&m.sb!=null&&m.sb!=='';
function standings(p){
 const ids=S.equipes.filter(e=>e.poule===p).map(e=>e.id);
 const T=Object.fromEntries(ids.map(id=>[id,{id,j:0,v:0,d:0,pm:0,pe:0}]));
 const ms=S.matchs.filter(m=>m.phase==='Poule'&&m.poule===p);
 ms.filter(scored).forEach(m=>{const A=T[m.a],B=T[m.b];if(!A||!B)return;const a=+m.sa,b=+m.sb;A.j++;B.j++;A.pm+=a;A.pe+=b;B.pm+=b;B.pe+=a;if(a>b){A.v++;B.d++}else if(b>a){B.v++;A.d++}});
 const rows=Object.values(T).sort((x,y)=>y.v-x.v||(y.pm-y.pe)-(x.pm-x.pe)||y.pm-x.pm);
 return {rows,complete:ms.length>0&&ms.every(scored)};
}
function resolve(ref){
 let m=ref&&ref.match(/^([12])([A-D])$/);
 if(m){const s=standings(m[2]);return s.complete&&s.rows[+m[1]-1]?s.rows[+m[1]-1].id:null}
 m=ref&&ref.match(/^([WL])(\w+)$/);
 if(m){const x=S.matchs.find(z=>z.code===m[2]);if(!x||!scored(x)||+x.sa===+x.sb)return null;const A=x.a||resolve(x.refA),B=x.b||resolve(x.refB);const aw=+x.sa>+x.sb;return m[1]==='W'?(aw?A:B):(aw?B:A)}
 return null;
}
function refLabel(r){let m=r.match(/^([12])([A-D])$/);if(m)return `${m[1]==='1'?'1er':'2e'} poule ${m[2]}`;m=r.match(/^([WL])(\w+)$/);if(m)return `${m[1]==='W'?'Vainqueur':'Perdant'} ${m[2].replace('QF','quart ').replace('SF','demie ')}`;return r}
function vJour(){
 const t=S.ui.jtab;
 return `<div class="tools"><div class="seg-ctl"><button data-act="jtab" data-v="matchs" class="${t==='matchs'?'on':''}">Matchs & classements</button><button data-act="jtab" data-v="deroule" class="${t==='deroule'?'on':''}">Déroulé de la journée</button></div><div class="grow"></div>
 ${t==='matchs'?`<button class="btn" data-act="csv" data-col="matchs">${ic(I.dl,16)}Exporter</button><button class="btn pri" data-act="gen"${ro()}>${ic(I.wand,16)}${S.matchs.length?'Regénérer le planning':'Générer le planning'}</button>`:`<button class="btn pri" data-act="add" data-col="deroule"${ro()}>${ic(I.plus,16)}Créneau</button>`}</div>
 ${t==='matchs'?vMatchs():tableHTML('deroule',[...S.deroule].sort((a,b)=>(a.heure||'').localeCompare(b.heure||'')),[{k:'heure',l:'Heure',w:110},{k:'titre',l:'Étape',w:260},{k:'detail',l:'Détail'},{k:'responsable',l:'Resp.',t:'mem',w:120}],{empty:'Aucun créneau.'})}`;
}
function vMatchs(){
 if(!S.matchs.length)return `<div class="empty">Le planning n’est pas encore généré. Inscris les équipes, puis clique sur « Générer le planning » : poules de 4, matchs de 15 minutes sur 2 terrains, puis quarts, demies, match pour la 3e place et finale. ${S.equipes.length?`${S.equipes.length} équipe(s) prête(s).`:''}</div>`;
 const ms=sortO(S.matchs);const phases=['Poule','Quart','Demie','3e place','Finale'];
 const side=(id,ref,win)=>{const n=id?teamName(id):(ref?teamName(resolve(ref)):null);return n?`<span class="${win?'w':''}">${esc(n)}</span>`:`<span class="ref">${esc(ref?refLabel(ref):'—')}</span>`};
 const P=['A','B','C','D'].filter(p=>S.equipes.some(e=>e.poule===p));
 return `<section class="poules">${P.map(p=>{const s=standings(p);return `<div class="tbl-wrap poule"><table><thead><tr><th>Poule ${p}</th><th>V</th><th>D</th><th>+/-</th></tr></thead><tbody>${s.rows.map((r,i)=>`<tr class="${i<2?'q':''}"><td>${esc(teamName(r.id))}</td><td class="n num">${r.v}</td><td class="n num">${r.d}</td><td class="n num">${r.pm-r.pe>0?'+':''}${r.pm-r.pe}</td></tr>`).join('')}</tbody></table></div>`}).join('')}</section>
 ${phases.map(ph=>{const L=ms.filter(m=>m.phase===ph);if(!L.length)return '';return `<section class="phase"><div class="sec-h"><h2>${ph==='Poule'?'Phase de poules':ph==='Quart'?'Quarts de finale':ph==='Demie'?'Demi-finales':ph==='3e place'?'Match pour la 3e place':'Finale'}</h2></div><div class="matchs">${L.map(m=>{const sc=scored(m),aw=sc&&+m.sa>+m.sb,bw=sc&&+m.sb>+m.sa;return `<div class="m"><span class="h">${esc(m.heure)}</span><span class="tr">T${m.terrain}${m.poule?' · '+m.poule:''}</span><span class="a">${side(m.a,m.refA,aw)}</span><input type="number" inputmode="numeric" min="0" max="99" data-f="matchs|${m.id}|sa" data-t="num" value="${m.sa??''}"${ro()} aria-label="Score"><span class="vs">–</span><input type="number" inputmode="numeric" min="0" max="99" data-f="matchs|${m.id}|sb" data-t="num" value="${m.sb??''}"${ro()} aria-label="Score"><span class="b">${side(m.b,m.refB,bw)}</span></div>`}).join('')}</div></section>`}).join('')}`;
}
let genArmed=0;
async function generate(btn){
 if(S.matchs.length&&Date.now()-genArmed>4000){genArmed=Date.now();btn.textContent='Confirmer : les scores seront effacés';btn.classList.add('danger');return}
 const eqs=sortO(S.equipes);if(eqs.length<2){toast('Ajoute au moins 2 équipes',1);return}
 const P=['A','B','C','D'];const cnt={A:0,B:0,C:0,D:0};eqs.forEach(e=>{if(e.poule)cnt[e.poule]++});
 let i=0;for(const e of eqs){if(!e.poule){const p=P.slice().sort((a,b)=>cnt[a]-cnt[b]||P.indexOf(a)-P.indexOf(b))[0];cnt[p]++;e.poule=p;await upd('equipes',e.id,{poule:p});i++}}
 for(const m of S.matchs)await delDoc('matchs',m.id);
 const rr=ids=>{const t=[...ids];if(t.length%2)t.push(null);const n=t.length,R=[];for(let r=0;r<n-1;r++){const pr=[];for(let k=0;k<n/2;k++){if(t[k]&&t[n-1-k])pr.push([t[k],t[n-1-k]])}R.push(pr);t.splice(1,0,t.pop())}return R};
 const per={};P.forEach(p=>per[p]=rr(eqs.filter(e=>e.poule===p).map(e=>e.id)));
 const maxR=Math.max(...P.map(p=>per[p].length));const list=[];
 for(let r=0;r<maxR;r++)for(const p of P)for(const [a,b] of (per[p][r]||[]))list.push({phase:'Poule',poule:p,a,b});
 list.forEach((m,k)=>{m.terrain=k%2+1;m.heure=addMin('10:00',Math.floor(k/2)*15);m.ordre=k});
 const slots=Math.ceil(list.length/2);const t0=addMin('10:00',slots*15+60);
 if(P.every(p=>cnt[p]>=2)){
  const F=[['Quart','QF1','1A','2B',0,1],['Quart','QF2','1B','2A',0,2],['Quart','QF3','1C','2D',15,1],['Quart','QF4','1D','2C',15,2],['Demie','SF1','WQF1','WQF3',45,1],['Demie','SF2','WQF2','WQF4',45,2],['3e place','P3','LSF1','LSF2',105,1],['Finale','FIN','WSF1','WSF2',135,1]];
  F.forEach((f,k)=>list.push({phase:f[0],code:f[1],refA:f[2],refB:f[3],a:null,b:null,heure:addMin(t0,f[4]),terrain:f[5],ordre:1000+k}));
 }
 for(const m of list){await db.collection('matchs').doc().set(Object.assign({sa:null,sb:null},m))}
 genArmed=0;toast(`${list.length} matchs générés`);
}

/* ---------- Messages ---------- */
function fillMsg(txt,p){
 const c=cfg();if(!p)return esc(txt).replace(/\[[^\]]+\]/g,m=>`<mark>${m}</mark>`);
 const first=(p.contact||'').trim().split(/\s+/)[0]||'';
 let t=txt.replace(/\[(Entreprise|Enseigne|nom)\]/g,p.nom).replace(/\[Prénom Nom\]/g,p.contact||'[Prénom Nom]').replace(/\[Prénom\]/g,first||'[Prénom]').replace(/\[lieu\]/g,c.lieu.replace(/\s*\(.*\)$/,''));
 return t;
}
function plain(m,p){const body=fillMsg(m.corps||'',p);const obj=m.objet?fillMsg(m.objet,p):'';const strip=s=>p?s:s.replace(/<\/?mark>/g,'').replace(/&amp;/g,'&').replace(/&lt;/g,'<').replace(/&gt;/g,'>').replace(/&quot;/g,'"').replace(/&#39;/g,"'");return (obj?`Objet : ${strip(obj)}\n\n`:'')+strip(body)}
function vMsg(){
 const ms=[...S.messages].sort((a,b)=>String(a.num).localeCompare(String(b.num),'fr',{numeric:true}));
 if(!S.ui.msg||!ms.find(m=>m.id===S.ui.msg))S.ui.msg=ms[0]?.id||null;
 const m=ms.find(x=>x.id===S.ui.msg);const p=S.partenaires.find(x=>x.id===S.ui.msgFor);
 const used=m?S.partenaires.filter(x=>String(x.message)===String(m.num)).length:0;
 return `<div class="msgs"><div class="mlist">${ms.map(x=>`<button data-act="msg" data-id="${x.id}" class="${x.id===S.ui.msg?'on':''}"><span class="no">${esc(x.num)}</span><span>${esc(x.titre)}</span></button>`).join('')}
 <button data-act="add" data-col="messages" style="color:var(--accent)"${ro()}>${ic(I.plus,16)} Nouveau modèle</button></div>
 ${m?`<div class="card editor"><div class="f2"><div class="field"><label for="m-t">Nom du modèle</label><input id="m-t" data-f="messages|${m.id}|titre" value="${esc(m.titre)}"${ro()}></div><div class="field"><label for="m-c">Pour qui</label><input id="m-c" data-f="messages|${m.id}|cible" value="${esc(m.cible||'')}"${ro()}></div></div>
 <div class="field"><label for="m-o">Objet (e-mail)</label><input id="m-o" data-f="messages|${m.id}|objet" value="${esc(m.objet||'')}"${ro()}></div>
 <div class="field"><label for="m-b">Message — les [crochets] sont remplacés automatiquement</label><textarea class="long" id="m-b" data-f="messages|${m.id}|corps"${ro()}>${esc(m.corps||'')}</textarea></div>
 <div class="tools"><select class="sel" id="msgFor" aria-label="Personnaliser pour">${`<option value="">Personnaliser pour un partenaire…</option>`+sortO(S.partenaires).map(x=>`<option value="${x.id}"${x.id===S.ui.msgFor?' selected':''}>${esc(x.nom)}</option>`).join('')}</select><span class="pill">${used} partenaire(s) lié(s)</span><div class="grow"></div>
 ${db&&canWrite?`<button class="x" data-del="messages|${m.id}" title="Supprimer le modèle">${ic(I.trash,15)}</button>`:''}<button class="btn pri" data-act="copymsg" data-id="${m.id}">${ic(I.copy,16)}Copier</button></div>
 <div class="preview" id="mprev">${m.objet?`<b>Objet : ${p?esc(fillMsg(m.objet,p)):fillMsg(m.objet)}</b>\n\n`:''}${p?esc(fillMsg(m.corps||'',p)).replace(/\[[^\]]+\]/g,x=>`<mark>${x}</mark>`):fillMsg(m.corps||'')}</div></div>`:`<div class="empty">Aucun modèle.</div>`}</div>`;
}

/* ---------- Réglages ---------- */
function vCfg(){
 const c=cfg();const dis=ro();
 const f=(k,l,t='text')=>`<div class="field"><label for="c-${k}">${l}</label><input id="c-${k}" type="${t}" data-cfg="${k}" ${t==='number'?'data-t="num"':''} value="${esc(c[k])}"${dis}></div>`;
 return `<section class="card"><h3>Le tournoi</h3><div class="f2">${f('nom','Nom')}${f('date','Date','date')}${f('lieu','Lieu')}${f('format','Format affiché')}</div></section>
 <section class="card"><h3>Inscriptions</h3><div class="f2">${f('prixInscription','Prix d’inscription par équipe (€)','number')}</div></section>
 <section class="card"><h3>Partager le QG avec l’association</h3><p style="margin:0;color:var(--muted)">Ouvre le menu Partager en haut de la page et invite chaque membre (ou toute l’organisation) avec le niveau <b style="color:var(--fg)">Contributeur</b> pour qu’il puisse modifier. Un Lecteur voit tout mais ne modifie rien. Toutes les modifications apparaissent en direct chez chacun.</p></section>
 <section class="card"><h3>L’équipe d’organisation</h3><div class="field"><label for="c-membres">Membres, séparés par des virgules (utilisés pour attribuer tâches, partenaires et matériel)</label><input id="c-membres" data-cfg="membres" value="${esc(c.membres.join(', '))}"${dis}></div></section>
 <section class="card"><h3>Liens utiles</h3><div class="links">
  <a href="https://www.3x3ffbb.com/page/organiser-un-open" target="_blank" rel="noopener">Organiser un Open 3x3<small>FFBB · homologation, Event Maker, règlements</small></a>
  <a href="https://www.3x3ffbb.com/uploads/2025-12-01-Tutoriel-Homologation-en-ligne-692da82cf22c6.pdf" target="_blank" rel="noopener">Tutoriel d’homologation<small>FFBB · décembre 2025</small></a>
  <a href="https://www.alsace.eu/delib-cea/7412.6.0.pdf" target="_blank" rel="noopener">Aide aux manifestations sportives<small>Collectivité européenne d’Alsace · dépôt 3 mois avant</small></a>
  <a href="https://www.strasbourg.eu/organiser-evenement-sportif" target="_blank" rel="noopener">Organiser un événement sportif<small>Ville de Strasbourg · prêt de matériel</small></a>
  <a href="https://www.sports.gouv.fr/le-basket-center" target="_blank" rel="noopener">Le Basket Center<small>180 avenue de Colmar, Strasbourg</small></a>
  <a href="https://lapassed.fr" target="_blank" rel="noopener">lapassed.fr<small>Site de l’association</small></a>
 </div></section>
 <section class="card"><h3>Sauvegarde</h3><p style="margin:0;color:var(--muted)">Toutes les données sont enregistrées en direct et partagées avec l’équipe. Tu peux aussi en télécharger une copie complète.</p><div><button class="btn" data-act="backup">${ic(I.dl,16)}Télécharger une sauvegarde (JSON)</button></div></section>`;
}

/* ---------- Fiche partenaire (tiroir) ---------- */
function openDrawer(id){drawer=id;renderDrawer()}
function closeDrawer(){drawer=null;$('#layer').querySelectorAll('.scrim,.drawer').forEach(e=>e.remove())}
function renderDrawer(){
 const p=S.partenaires.find(x=>x.id===drawer);if(!p){closeDrawer();return}
 const L=$('#layer');const old=L.querySelector('.dr-b');const sc=old?old.scrollTop:0;L.querySelectorAll('.scrim,.drawer').forEach(e=>e.remove());
 const dis=ro();const fld=(k,l,t='text',extra='')=>`<div class="field"><label for="d-${k}">${l}</label>${t==='area'?`<textarea id="d-${k}" data-f="partenaires|${p.id}|${k}"${dis}>${esc(p[k]||'')}</textarea>`:`<input id="d-${k}" type="${t}" data-f="partenaires|${p.id}|${k}" ${t==='number'?'data-t="num"':''} value="${esc(p[k]??'')}"${dis}${extra}>`}</div>`;
 const sel=(k,l,o,e)=>`<div class="field"><label for="d-${k}">${l}</label><select id="d-${k}" data-f="partenaires|${p.id}|${k}"${dis}>${opt(o,p[k],e)}</select></div>`;
 const ms=[...S.messages].sort((a,b)=>String(a.num).localeCompare(String(b.num),'fr',{numeric:true}));
 const m=ms.find(x=>String(x.num)===String(p.message));
 L.insertAdjacentHTML('beforeend',`<div class="scrim" data-act="close"></div><aside class="drawer" role="dialog" aria-label="Fiche partenaire">
  <div class="dr-h"><h2>${esc(p.nom)}</h2><span class="pill ${stCls(p.statut).replace('st-','')}">${esc(p.statut)}</span><button class="x" data-act="close" aria-label="Fermer">${ic(I.x,18)}</button></div>
  <div class="dr-b">
   ${p.majLe&&p.majPar?`<div style="color:var(--muted);font-size:12px">Modifié par ${esc(who(p.majPar))} ${ago(p.majLe)}</div>`:''}
   <div class="f2">${fld('nom','Nom du partenaire')}${fld('ville','Ville')}</div>
   <div class="f2">${sel('statut','Statut',P_STATUTS)}${sel('categorie','Catégorie',P_CATS)}${sel('pack','Pack',PACKS)}${fld('montant','Montant (€)','number')}</div>
   ${fld('demande','Ce qu’on demande','area')}
   <div class="f2">${fld('contact','Interlocuteur')}${fld('coordonnees','Coordonnées')}</div>
   <div class="f2">${fld('prochaineAction','Prochaine action')}${fld('dateAction','Date de la prochaine action','date')}${sel('responsable','Responsable',cfg().membres,'À attribuer')}${sel('message','Message à utiliser',ms.map(x=>String(x.num)),'—')}</div>
   ${fld('notes','Notes et historique des échanges','area')}
   ${m?`<div class="field"><label>Message n°${esc(m.num)} · ${esc(m.titre)}, personnalisé</label><div class="preview">${m.objet?`<b>Objet : ${esc(fillMsg(m.objet,p))}</b>\n\n`:''}${esc(fillMsg(m.corps||'',p)).replace(/\[[^\]]+\]/g,x=>`<mark>${x}</mark>`)}</div></div>`:''}
  </div>
  <div class="dr-f">${db&&canWrite?`<button class="btn danger" data-del="partenaires|${p.id}">${ic(I.trash,16)}Supprimer</button>`:'<span></span>'}${m?`<button class="btn pri" data-act="copymsg" data-id="${m.id}" data-for="${p.id}">${ic(I.copy,16)}Copier le message</button>`:''}</div>
 </aside>`);
 const nb=L.querySelector('.dr-b');if(nb)nb.scrollTop=sc;
}

/* ===================== Interactions ===================== */
function go(v){if(!VIEWS.find(x=>x[0]===v))v='tableau';view=v;if(room)room.presence({vue:v}).catch(()=>{});try{if(location.hash!=='#'+v)history.replaceState(null,'','#'+v)}catch(e){}renderAll();window.scrollTo(0,0)}
async function copyText(t){try{await navigator.clipboard.writeText(t);toast('Copié dans le presse-papiers')}catch(e){const ta=document.createElement('textarea');ta.value=t;ta.style.position='fixed';ta.style.opacity='0';document.body.appendChild(ta);ta.select();let ok=false;try{ok=document.execCommand('copy')}catch(_){}ta.remove();toast(ok?'Copié dans le presse-papiers':'Copie impossible : sélectionne le texte à la main',!ok)}}
function toCSV(col){
 const rows=col==='budget'?budgetRows():sortO(S[col]);if(!rows.length)return '';
 const keys=[...new Set(rows.flatMap(r=>Object.keys(r)))].filter(k=>!['id','ordre','_auto'].includes(k));
 const q=v=>{v=v==null?'':Array.isArray(v)?v.join(', '):String(v);return /[";\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v};
 return '﻿'+[keys.join(';'),...rows.map(r=>keys.map(k=>q(r[k])).join(';'))].join('\n');
}
async function save(filename,data){
 if(!dl)dl=await (window.claude?.use?.('downloads')||Promise.resolve(null));
 if(!dl){toast('Téléchargement indisponible dans cette vue',1);return}
 try{await dl.save({filename,data});}catch(e){if(e&&e.code!=='declined')toast('Téléchargement refusé',1)}
}
const delArm=new Map();
document.addEventListener('click',async e=>{
 const t=e.target.closest('[data-go],[data-act],[data-del],[data-open]');if(!t)return;
 if(t.dataset.go){e.preventDefault();go(t.dataset.go);return}
 if(t.dataset.del){
  const k=t.dataset.del;if(delArm.get(k)&&Date.now()-delArm.get(k)<3500){delArm.delete(k);const[c,id]=k.split('|');if(c==='partenaires'&&drawer===id)closeDrawer();await delDoc(c,id);toast('Supprimé');return}
  delArm.set(k,Date.now());t.classList.add('armed');t.dataset.prev=t.innerHTML;t.textContent='Confirmer';setTimeout(()=>{if(t.isConnected&&t.classList.contains('armed')){t.classList.remove('armed');t.innerHTML=t.dataset.prev}},3500);return;
 }
 const a=t.dataset.act;
 if(t.dataset.open&&!a){if(t.closest('.pc')&&t.closest('.pc').classList.contains('drag'))return;openDrawer(t.dataset.open);return}
 if(a==='close'){closeDrawer();return}
 if(a==='pview'){S.ui.pview=t.dataset.v;ls.set('pview',S.ui.pview);renderView();return}
 if(a==='jtab'){S.ui.jtab=t.dataset.v;renderView();return}
 if(a==='msg'){S.ui.msg=t.dataset.id;renderView();return}
 if(a==='mine'){S.ui.tresp=ME;renderView();return}
 if(a==='addp'){const id=await addDoc('partenaires',DEFAULTS.partenaires());if(id)openDrawer(id);return}
 if(a==='addt'){const id=await addDoc('taches',DEFAULTS.taches(t.dataset.ph||'Divers'));return}
 if(a==='addb'){await addDoc('budget',DEFAULTS.budget(t.dataset.t));return}
 if(a==='add'){const c=t.dataset.col;const id=await addDoc(c,DEFAULTS[c]());if(c==='messages'&&id){S.ui.msg=id}return}
 if(a==='gen'){if(!db)return;t.disabled=true;try{await generate(t)}finally{t.disabled=false}return}
 if(a==='copymsg'){const m=S.messages.find(x=>x.id===t.dataset.id);const p=S.partenaires.find(x=>x.id===(t.dataset.for||S.ui.msgFor));if(m)copyText(plain(m,p));return}
 if(a==='csv'){const c=t.dataset.col;const csv=toCSV(c);if(!csv){toast('Rien à exporter',1);return}save(`la-passe-d-${c}.csv`,csv);return}
 if(a==='backup'){const o={config:cfg()};COLS.forEach(c=>o[c]=S[c]);save('la-passe-d-sauvegarde.json',JSON.stringify(o,null,2));return}
});
document.addEventListener('change',e=>{
 const el=e.target;
 if(el.dataset.f){const[c,id,k]=el.dataset.f.split('|');let v=el.dataset.t==='chk'?el.checked:el.dataset.t==='num'?(el.value===''?(c==='matchs'?null:0):Number(el.value)):el.value;
  if(c==='taches'&&k==='fait'){const row=el.closest('.task');if(row)row.classList.toggle('done',v)}
  upd(c,id,{[k]:v});if(el.classList.contains('st-sel')){el.className=el.className.replace(/st-\w+/g,'').trim()+' st-sel '+stCls(v)}
  if(c==='partenaires'&&k==='statut'&&v==='Signé')toast('Partenaire signé. Le budget est mis à jour.');
  return}
 if(el.dataset.cfg){const k=el.dataset.cfg;let v=el.value;if(k==='membres')v=v.split(',').map(s=>s.trim()).filter(Boolean);else if(el.dataset.t==='num')v=Number(v)||0;setCfg({[k]:v});return}
 if(el.id==='pcat'){S.ui.pcat=el.value;renderPBody();return}
 if(el.id==='tresp'){S.ui.tresp=el.value;renderView();return}
 if(el.id==='thide'){S.ui.thide=el.checked;ls.set('thide',el.checked);renderView();return}
 if(el.id==='msgFor'){S.ui.msgFor=el.value;renderView();return}
 if(el.id==='me'){ME=el.value;ls.set('me',ME);renderView();return}
});
document.addEventListener('input',e=>{if(e.target.id==='pq'){S.ui.pq=e.target.value;renderPBody()}if(e.target.id==='m-b'||e.target.id==='m-o'){const m=S.messages.find(x=>x.id===S.ui.msg);if(m){if(e.target.id==='m-b')m.corps=e.target.value;else m.objet=e.target.value;const p=S.partenaires.find(x=>x.id===S.ui.msgFor);$('#mprev').innerHTML=(m.objet?`<b>Objet : ${p?esc(fillMsg(m.objet,p)):fillMsg(m.objet)}</b>\n\n`:'')+(p?esc(fillMsg(m.corps||'',p)).replace(/\[[^\]]+\]/g,x=>`<mark>${x}</mark>`):fillMsg(m.corps||''))}}});
/* glisser-déposer kanban */
document.addEventListener('dragstart',e=>{const c=e.target.closest&&e.target.closest('.pc');if(!c)return;c.classList.add('drag');e.dataTransfer.setData('text/plain',c.dataset.pid);e.dataTransfer.effectAllowed='move'});
document.addEventListener('dragend',e=>{const c=e.target.closest&&e.target.closest('.pc');if(c)setTimeout(()=>c.classList.remove('drag'),50);document.querySelectorAll('.col.over').forEach(x=>x.classList.remove('over'))});
document.addEventListener('dragover',e=>{const col=e.target.closest&&e.target.closest('[data-drop]');if(!col)return;e.preventDefault();document.querySelectorAll('.col.over').forEach(x=>x!==col&&x.classList.remove('over'));col.classList.add('over')});
document.addEventListener('drop',e=>{const col=e.target.closest&&e.target.closest('[data-drop]');if(!col)return;e.preventDefault();col.classList.remove('over');const id=e.dataTransfer.getData('text/plain');const p=S.partenaires.find(x=>x.id===id);if(p&&p.statut!==col.dataset.drop){upd('partenaires',id,{statut:col.dataset.drop});renderPBody();renderNav();if(col.dataset.drop==='Signé')toast('Partenaire signé. Le budget est mis à jour.')}});
/* clavier */
document.addEventListener('keydown',e=>{
 const typing=e.target.matches('input,textarea,select');
 if(e.key==='Escape'){if(drawer){closeDrawer();return}if(!$('#res').hidden){$('#res').hidden=true;$('#q').blur()}}
 if(typing)return;
 if(e.key==='/'){e.preventDefault();$('#q').focus();return}
 if(/^[1-9]$/.test(e.key)&&!e.metaKey&&!e.ctrlKey&&!e.altKey){go(VIEWS[+e.key-1][0])}
 if(e.key==='Enter'&&e.target.classList.contains('pc'))openDrawer(e.target.dataset.open);
});
/* recherche globale */
$('#q').addEventListener('input',()=>{
 const q=$('#q').value.trim().toLowerCase(),R=$('#res');if(q.length<2){R.hidden=true;return}
 const src=[['partenaires','Partenaire',p=>p.nom+' '+(p.contact||'')+' '+(p.notes||''),p=>p.nom],['taches','Tâche',t=>t.titre,t=>t.titre],['materiel','Matériel',m=>m.item+' '+(m.source||''),m=>m.item],['benevoles','Bénévole',b=>b.nom,b=>b.nom],['equipes','Équipe',e=>e.nom+' '+(e.joueurs||'')+' '+(e.capitaine||''),e=>e.nom],['messages','Message',m=>m.titre+' '+(m.corps||''),m=>m.titre]];
 const hits=[];src.forEach(([c,l,f,n])=>S[c].forEach(r=>{if(f(r).toLowerCase().includes(q))hits.push({c,l,n:n(r),id:r.id})}));
 R.innerHTML=hits.slice(0,12).map(h=>`<button data-hit="${h.c}|${h.id}"><span>${esc(h.n)}</span><small>${h.l}</small></button>`).join('')||`<div class="empty" style="border:0">Aucun résultat pour « ${esc(q)} »</div>`;R.hidden=false;
});
$('#res').addEventListener('click',e=>{const b=e.target.closest('[data-hit]');if(!b)return;const[c,id]=b.dataset.hit.split('|');$('#res').hidden=true;$('#q').value='';
 if(c==='partenaires'){go('partenaires');openDrawer(id)}else if(c==='messages'){S.ui.msg=id;go('messages')}else{go(c);setTimeout(()=>{const el=document.querySelector(`[data-f^="${c}|${id}|"]`);if(el){el.scrollIntoView({block:'center'});el.focus()}},50)}});
document.addEventListener('click',e=>{if(!e.target.closest('.search'))$('#res').hidden=true});

/* ===================== Démarrage ===================== */
function fillMe(){const c=cfg();$('#me').innerHTML=`<option value="">—</option>`+c.membres.map(m=>`<option${m===ME?' selected':''}>${esc(m)}</option>`).join('')}
async function boot(){
 view=(location.hash||'').slice(1)||'tableau';if(!VIEWS.find(x=>x[0]===view))view='tableau';
 fillMe();renderAll();
 try{db=await (window.claude?.use?.('db')||Promise.resolve(null))}catch(e){db=null}
 if(!db){mode='off';renderAll();return}
 mode='on';
 try{usr=await claude.use('user');if(usr){myId=await usr.id();const r=usr.can?await usr.can('data.write'):null;if(r===false)canWrite=false}}catch(e){}
 claude.use('room').then(r=>{if(!r)return;room=r;r.presence({uid:myId||null,vue:view}).catch(()=>{});r.onPeers(ch=>{peers=ch.peers;resolveNames([...new Set(peers.map(p=>p.by||p.presence?.uid).filter(Boolean))].filter(id=>!names[id]));const o=$('#online');if(o)o.innerHTML=onlineHTML();else renderNav()})}).catch(()=>{});
 db.doc('config/main').onSnapshot(s=>{S.cfg=s.exists?s.data():null;fillMe();schedule()},()=>{});
 COLS.forEach(c=>db.collection(c).onSnapshot(s=>{S[c]=s.docs.map(d=>Object.assign({id:d.id},d.data()));S.loaded[c]=true;schedule()},err=>{if(err&&err.code==='revoked'){db=null;mode='off';schedule()}}));
}
window.addEventListener('hashchange',()=>{const v=location.hash.slice(1);if(v&&v!==view&&VIEWS.find(x=>x[0]===v))go(v)});
boot();
</script>

</body></html>
